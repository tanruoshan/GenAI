<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLN600 Repair Demo</title>
<style>
:root{
  --bg:#F3F0E8; --surface:#FBFAF6; --ink:#1C2533; --ink2:#3E4A5B; --muted:#6B7280; --rule:#DCD6C8; --soft:#ECE8DF;
  --good:#1a7f37; --good-bg:#DDF1E3; --bad:#B42318; --bad-bg:#FBE3E0; --focus:#2a78d6;
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45}
body{min-height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
header{display:flex;align-items:center;gap:24px;padding:14px 28px;background:var(--ink);color:#F6F4EF;position:sticky;top:0;z-index:5}
header h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;white-space:nowrap}
@media (max-width:1500px){header h1 .long{display:none}}
header h1 span{color:#E3A46B}
nav.scenes{display:flex;gap:2px;flex-wrap:nowrap;flex:1;justify-content:center}
nav.scenes button{background:transparent;border:1px solid transparent;color:#C9D2DE;padding:6px 12px;border-radius:999px;font-size:15px;white-space:nowrap}
nav.scenes button .k{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:5px;background:#2E3A4D;color:#E3A46B;font-size:13px;text-align:center;margin-right:7px;font-weight:600}
nav.scenes button[aria-selected=true]{background:#F6F4EF;color:var(--ink)}
nav.scenes button[aria-selected=true] .k{background:var(--ink);color:#F6F4EF}
.badges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:13px;padding:4px 10px;border-radius:999px;background:#2E3A4D;color:#C9D2DE;white-space:nowrap}
.badge.ok{background:#21452F;color:#BDE5C8}
.badge.warn{background:#5A2A1C;color:#FFD2C2}

main{flex:1;padding:24px 28px 40px;max-width:1700px;width:100%;margin:0 auto}
section.scene{display:none}
section.scene.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#2E5EAA;font-weight:600;margin:0 0 6px}
h2{font-family:var(--serif);font-size:34px;line-height:1.15;margin:0 0 6px;font-weight:600}
.lede{color:var(--ink2);margin:0 0 18px;max-width:1100px;font-size:18px}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 18px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group > label.t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 13px;border-right:1px solid var(--rule);font-size:15px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#F6F4EF}
.btn{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:7px 12px;font-size:15px}
.btn.primary{background:var(--ink);color:#F6F4EF;border-color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
select,input[type=search],input[type=text]{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:7px 10px;font-size:15px}
.sid{font-family:var(--mono);font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 12px 5px 9px;font-size:14px}
.chip .sw{width:18px;height:4px;border-radius:2px}
.chip[aria-pressed=false]{opacity:.45}

/* sentence panel */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px 26px}
.sentence{font-family:var(--serif);font-size:27px;line-height:1.9;margin:0}
.tok{border-radius:5px;padding:1px 2px;white-space:nowrap;transition:background .3s,color .3s}
.tok.dmg{font-family:var(--mono);font-size:23px;background:#E4E9F2;color:#1E3F7A;padding:2px 5px;animation:glitch .45s ease}
.tok.drop{font-family:var(--mono);font-size:23px;background:#E7E3DA;color:#7A7468;padding:2px 6px}
.tok.goldspan{background:#FFF1C9}
.tok.fact{text-decoration:underline dotted 2px;text-underline-offset:5px;text-decoration-color:#9A8F7A}
.tok.anchor{box-shadow:0 0 0 2.5px #B85C1E inset}
.tok.out{color:#A39C8D}
@keyframes glitch{0%{transform:translateY(-3px);opacity:.2;filter:blur(2px)}60%{transform:translateY(1px);opacity:1;filter:none}100%{transform:none}}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.stat{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 16px;min-width:170px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.legend-line{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--ink2)}
.legend-line i{display:inline-block;width:22px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px}

/* repair race */
.race{display:grid;grid-template-columns:230px 1fr 230px;gap:0;border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--surface)}
.race > div{padding:13px 16px;border-top:1px solid var(--rule);display:flex;align-items:center}
.race > div.h{border-top:0;background:var(--soft);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:9px 16px}
.mname{gap:10px;font-weight:600}
.mname .bar{width:6px;align-self:stretch;border-radius:3px;min-height:34px}
.mname small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.span-line{font-family:var(--serif);font-size:23px;line-height:1.8;flex-wrap:wrap}
.span-line .ctx{color:#A39C8D}
.w{border-radius:5px;padding:1px 4px;margin:0 1px}
.w.ok{background:var(--good-bg);color:#0F4D22}
.w.no{background:var(--bad-bg);color:#7A1A11}
.w.no::after{content:" ✗";font-size:.7em;color:var(--bad)}
.w.ok::after{content:" ✓";font-size:.7em;color:var(--good)}
.w.anchor{box-shadow:0 0 0 2.5px #B85C1E inset}
.w.empty{font-family:var(--mono);font-size:.8em}
.fail{font-size:14px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:2px 8px;margin-right:10px}
.score{gap:12px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.pill{font-size:14px;border-radius:999px;padding:3px 10px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:#0F4D22}
.pill.bad{background:var(--bad-bg);color:#7A1A11}
.num{font-size:15px;color:var(--ink2)}
.race > div.gold{background:#FFF8E1}

/* charts */
.chartwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.chart{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 6px 20px rgba(28,37,51,.12);min-width:230px;display:none;z-index:3}
.tip .lv{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .row .k{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .row .k i{display:inline-block;width:16px;height:3px;border-radius:2px}
.tip .row b{font-variant-numeric:tabular-nums}
.tip .row small{color:var(--muted);font-variant-numeric:tabular-nums}
.hyps{display:flex;flex-direction:column;gap:10px}
.hyp{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.hyp[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.hyp .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hyp b{font-family:var(--serif);font-size:20px}
.hyp p{margin:6px 0 0;font-size:14.5px;color:var(--ink2)}
.verdict{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.verdict.part{background:#FFF1C9;color:#6E5300}
.verdict.no{background:var(--bad-bg);color:#7A1A11}
.verdict.yes{background:var(--good-bg);color:#0F4D22}
.note{font-size:14px;color:var(--muted);margin-top:10px}
table.mini{border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;width:100%}
table.mini th,table.mini td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:right}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{font-size:13px;color:var(--muted);font-weight:600}

/* metric trap */
.trap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;align-items:start}
.big{font-family:var(--serif);font-size:64px;line-height:1;font-weight:600}
.detail{display:flex;flex-direction:column;gap:10px}
.detail .row{font-family:var(--serif);font-size:20px;line-height:1.5}
.detail .lab{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gal{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-align:left}
.gal .g{font-family:var(--serif);font-size:19px}
.gal .r{font-family:var(--serif);font-size:19px;color:#7A1A11}

/* lookup */
.lookup{display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:26px;align-items:start}
.lookup input{font-family:var(--mono);font-size:34px;padding:12px 16px;width:100%;border-radius:12px}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.cand{display:grid;grid-template-columns:1fr 90px 110px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:9px 14px;font-variant-numeric:tabular-nums}
.cand:first-child{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.cand .wd{font-family:var(--serif);font-size:26px}
.cand .d{font-size:14px;color:var(--ink2)}
.cand .f{font-size:14px;color:var(--muted);text-align:right}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.presets button{font-family:var(--mono)}
.explain{font-size:17px;color:var(--ink2)}
.explain code{font-family:var(--mono);background:#fff;border:1px solid var(--rule);border-radius:6px;padding:1px 6px}
footer{padding:10px 28px 18px;color:var(--muted);font-size:13px;max-width:1700px;margin:0 auto;width:100%}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff;color:var(--ink2)}
.sr{position:absolute;left:-9999px}
@media (max-height:860px){main{padding:12px 24px 24px}.eyebrow{display:none}h2{font-size:26px;margin-bottom:4px}.lede{font-size:15px;margin-bottom:10px}
  .controls{padding:7px 12px;margin-bottom:10px}.race > div{padding:5px 14px}.span-line{font-size:19px;line-height:1.55}.tok.dmg,.tok.drop{font-size:19px}}
@media (max-width:1100px){.chartwrap,.trap,.lookup{grid-template-columns:1fr}.race{grid-template-columns:150px 1fr}.race > div.sc{display:none}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1><span class="long">How Much Damage Can GenAI Repair? </span><span>Live demo</span></h1>
  <nav class="scenes" role="tablist" aria-label="Scenes"></nav>
  <div class="badges" id="badges"></div>
</header>
<main>
  <section class="scene" id="s-damage" aria-labelledby="t-damage"></section>
  <section class="scene" id="s-repair"></section>
  <section class="scene" id="s-results"></section>
  <section class="scene" id="s-trap"></section>
  <section class="scene" id="s-lookup"></section>
</main>
<footer id="foot"></footer>
<script>
const DATA=/*__PAYLOAD__*/null;
</script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------- setup
const COLORS={bertdict:"#2a78d6",llm:"#eb6834",bart:"#1baf7a",lookup:"#eda100",bert:"#e87ba4",llmart:"#008300",none:"#8b8b85"};
const DASH={bertdict:"",llm:"",bart:"",lookup:"",bert:"7 5",llmart:"7 5",none:"3 5"};
const LEVEL_NAME={"0":"clean","1w":"1 word","10":"10%","25":"25%","50":"50%","75":"75%"};
const LEVELS=DATA.levels, M=DATA.methods, MK=M.map(m=>m.key);
const MNAME=Object.fromEntries(M.map(m=>[m.key,m.name])); MNAME.none="No repair";
const MAIN=["bertdict","llm","lookup","bart"];
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){
  if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
  else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);} for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));} return e;};
const svgEl=(tag,attrs={})=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e;};
const fmt=(v,d=2)=>v==null||Number.isNaN(v)?"–":(v<0?"−":"")+Math.abs(v).toFixed(d);
const pct=v=>v==null?"–":Math.round(v*100)+"%";
const S=DATA.sentences, byId=Object.fromEntries(S.map((s,i)=>[s.id,i]));

const state={scene:0,idx:Math.max(0,byId[DATA.featured[0]]??0),level:"25",filter:"all",
  metric:"anchor",shown:new Set(["bertdict","llm","lookup","bart","none"]),validOnly:false,hyp:null,
  trapLevel:"25",trapMethod:"bart",trapSel:null,trapAll:false,lookupWord:"Hacley",full:false,playing:null};

// --------------------------------------------------------------------------------- sentence filters
const FILTERS={
  all:{name:`All ${S.length} test sentences`,f:()=>true},
  manual:{name:"Seeded manual check (6)",f:s=>DATA.featured.includes(s.id)},
  bertwin:{name:"BERT + dict. ✓, LLM ✗ (anchor, at this level)",f:(s,lv)=>s.repairs[lv].bertdict.anchor&&!s.repairs[lv].llm.anchor},
  llmwin:{name:"LLM ✓, BERT + dict. ✗",f:(s,lv)=>s.repairs[lv].llm.anchor&&!s.repairs[lv].bertdict.anchor},
  fail:{name:"LLM format failure",f:(s,lv)=>!s.repairs[lv].llm.fmt},
  bartwrong:{name:"BART fluent but wrong anchor",f:(s,lv)=>!s.repairs[lv].bart.anchor&&s.repairs[lv].bart.fmt&&s.repairs[lv].bart.w.some(w=>w&&/^[A-Z]/.test(w))},
  nobody:{name:"No method restores the anchor",f:(s,lv)=>MK.every(k=>!s.repairs[lv][k].anchor)},
};
const lvForFilter=()=>state.level==="0"?"1w":state.level;
function pool(){const lv=lvForFilter();return S.map((s,i)=>i).filter(i=>FILTERS[state.filter].f(S[i],lv));}
function step(d){const p=pool();if(!p.length)return;let pos=p.indexOf(state.idx);pos=pos<0?0:(pos+d+p.length)%p.length;state.idx=p[pos];render();}
function randomPick(){const p=pool();if(p.length)state.idx=p[Math.floor(Math.random()*p.length)];render();}

// ------------------------------------------------------------------------------------------ chrome
const SCENES=[["damage","The damage"],["repair","The repair race"],["results","Results"],["trap","The metric trap"],["lookup","Try the lookup"]];
function buildNav(){
  const nav=$("nav.scenes");
  SCENES.forEach(([id,name],i)=>nav.append(el("button",{role:"tab",id:"t-"+id,"aria-controls":"s-"+id,onclick:()=>{state.scene=i;render();}},
    el("span",{class:"k",text:String(i+1)}),name)));
  const b=$("#badges"), meta=DATA.meta;
  b.append(el("span",{class:"badge "+(meta.verified?"ok":"warn"),text:meta.verified?"Data: frozen v2, hash verified":"UNVERIFIED data: test build"}));
  b.append(el("span",{class:"badge "+(meta.mismatches.length?"warn":"ok"),
    text:meta.mismatches.length?`${meta.mismatches.length} of ${meta.checked} means differ from notebook 4`:`${meta.checked} means match notebook 4`}));
  $("#foot").append("Test split, 150 sentences × 5 levels. Intervals, tests and SQ3 rates are read from the executed notebooks/04_evaluation.ipynb; per-sentence repairs from runs/preds/. ",
    el("kbd",{text:"1"}),"–",el("kbd",{text:"5"})," scenes · ",el("kbd",{text:"←"}),el("kbd",{text:"→"})," level · ",
    el("kbd",{text:"↑"}),el("kbd",{text:"↓"})," sentence · ",el("kbd",{text:"Space"})," play levels · ",el("kbd",{text:"R"})," random.");
}

function sentenceControls(withClean){
  const s=S[state.idx], p=pool(), pos=p.indexOf(state.idx);
  const lvls=(withClean?["0"]:[]).concat(LEVELS);
  const sel=el("select",{"aria-label":"Which sentences to step through",onchange:e=>{state.filter=e.target.value;const q=pool();if(q.length&&!q.includes(state.idx))state.idx=q[0];render();}},
    ...Object.entries(FILTERS).map(([k,f])=>el("option",{value:k,selected:k===state.filter},f.name)));
  const seg=el("div",{class:"seg",role:"group","aria-label":"Damage level"},...lvls.map(l=>el("button",{"aria-pressed":String(state.level===l),onclick:()=>{stopPlay();state.level=l;render();}},LEVEL_NAME[l])));
  if(!withClean&&state.level==="0"){state.level="1w";}
  return el("div",{class:"controls"},
    el("div",{class:"group"},el("label",{class:"t",text:"Sentence"}),
      el("button",{class:"btn","aria-label":"Previous sentence",onclick:()=>step(-1)},"◀"),
      el("button",{class:"btn","aria-label":"Next sentence",onclick:()=>step(1)},"▶"),
      el("button",{class:"btn",onclick:randomPick},"Random"),
      el("span",{class:"sid",text:`${s.id} · ${s.tokens.length} words · ${pos<0?"not in filter":(pos+1)+" / "+p.length}`})),
    el("div",{class:"group"},sel),
    el("div",{class:"group"},el("label",{class:"t",text:"Damage"}),seg,
      el("button",{class:"btn primary",onclick:togglePlay,"aria-label":"Play through the levels"},state.playing?"■ Stop":"▶ Play")));
}
function togglePlay(){ if(state.playing){stopPlay();render();return;}
  const seq=(state.scene===0?["0"]:[]).concat(LEVELS); let i=Math.max(0,seq.indexOf(state.level));
  if(i===seq.length-1)i=-1;
  state.playing=setInterval(()=>{i++; if(i>=seq.length){stopPlay();render();return;} state.level=seq[i]; render();},1500);
  i++; state.level=seq[Math.min(i,seq.length-1)]; render();}
function stopPlay(){if(state.playing){clearInterval(state.playing);state.playing=null;}}

// ---------------------------------------------------------------------------------- scene 1: damage
function renderDamage(root){
  const s=S[state.idx], lv=state.level;
  root.append(el("p",{class:"eyebrow",text:"Scene 1 · controlled damage"}),
    el("h2",{text:"One fact, damaged at five nested levels"}),
    el("p",{class:"lede",text:"The anchor fact is always damaged and never dropped. Each larger span contains the smaller ones, and a damaged word looks the same at every level: higher levels only add damaged words around it."}),
    sentenceControls(true));
  const L=lv==="0"?null:s.levels[lv];
  const slots=L?Object.fromEntries(L.slots.map(([i,out,d])=>[i,{out,d}])):{};
  const facts=new Set(s.facts);
  const sent=el("p",{class:"sentence"});
  s.tokens.forEach((t,i)=>{
    const sl=slots[i];
    let cls="tok", txt=t;
    if(sl){cls+=sl.d?" drop":" dmg"; txt=sl.d?"⟨?⟩":sl.out;}
    if(facts.has(i)&&!sl)cls+=" fact";
    if(i===s.anchor)cls+=" anchor";
    sent.append(el("span",{class:cls,title:sl?`gold: ${t}`:(i===s.anchor?"anchor fact":facts.has(i)?"fact token":""),text:txt})," ");
  });
  const k=L?L.slots.length:0, nf=L?L.facts.length:0, nd=L?L.slots.filter(x=>x[2]).length:0;
  root.append(el("div",{class:"card"},sent,
    el("div",{class:"legend-line"},
      el("span",{},el("i",{style:"background:#E4E9F2;box-shadow:inset 0 0 0 1px #9FB0CF"}),"damaged word, as the model sees it"),
      el("span",{},el("i",{style:"background:#E7E3DA"}),"⟨?⟩ dropped word"),
      el("span",{},el("i",{style:"box-shadow:inset 0 0 0 2.5px #B85C1E"}),"anchor fact"),
      el("span",{},el("i",{style:"border-bottom:2px dotted #9A8F7A;border-radius:0;height:12px"}),"fact token (hover a damaged word for its gold form)")),
    el("div",{class:"stats"},
      el("div",{class:"stat"},el("b",{text:`${k} / ${s.tokens.length}`}),el("span",{text:"words damaged"})),
      el("div",{class:"stat"},el("b",{text:String(nf)}),el("span",{text:"facts in the span"})),

  if(!DATA.lexicon){root.append(el("div",{class:"card",text:"The word list was not built (data/raw/BLN600 missing when the demo was built)."}));return;}
  LEX=LEX||DATA.lexicon;
  const s=S[state.idx], L=s.levels[state.level==="0"?"1w":state.level];
  const presets=[...new Set(L.slots.filter(x=>!x[2]).map(x=>x[1].replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"")).filter(Boolean))].slice(0,8);
  const input=el("input",{type:"text",value:state.lookupWord,placeholder:"type a damaged word, e.g. Hacley","aria-label":"Damaged word",spellcheck:"false",autocomplete:"off"});
  const list=el("div",{class:"cands"});
  const run=()=>{state.lookupWord=input.value.trim(); list.replaceChildren();
    if(!state.lookupWord)return; const res=nearest(state.lookupWord);
    res.forEach(([w,d,c])=>list.append(el("div",{class:"cand"},el("span",{class:"wd",text:w}),el("span",{class:"d",text:`${d} edit${d===1?"":"s"}`}),el("span",{class:"f",text:`${c.toLocaleString()}×`}))));};
  input.addEventListener("input",run);
  const pre=el("div",{class:"presets"},...["Hacley","Wrighb","Curbis","Jeseph"].concat(presets).map(p=>
    el("button",{class:"btn",onclick:()=>{input.value=p;run();input.focus();}},p)));
  root.append(el("div",{class:"lookup"},el("div",{},input,pre,list),
    el("div",{class:"card explain"},
      el("p",{style:"margin-top:0"},el("b",{text:`${LEX.length.toLocaleString()} words`})," in the list. The presets after the first four are the damaged words of the current sentence at this level (",el("span",{class:"sid",text:s.id}),")."),
      el("p",{},"BERT + dictionary adds the ",el("code",{text:"5"})," closest list words to BERT's own candidates and lets letter similarity (weight ",el("code",{text:"λ = 64"}),") decide; BERT's context breaks near ties and fills dropped words."),
      el("p",{},"Where the list fails: only 77% of damaged fact words are in it (dev), and a dropped word has no letters to look up. That is where GenAI could add something, and mostly did not."))));
  run();
}

// ----------------------------------------------------------------------------------------- render
const RENDER=[renderDamage,renderRepair,renderResults,renderTrap,renderLookup];
function render(){
  document.querySelectorAll("nav.scenes button").forEach((b,i)=>b.setAttribute("aria-selected",String(i===state.scene)));
  document.querySelectorAll("section.scene").forEach((sec,i)=>{sec.classList.toggle("active",i===state.scene);if(i!==state.scene)sec.replaceChildren();});
  const root=document.querySelectorAll("section.scene")[state.scene]; root.replaceChildren(); RENDER[state.scene](root);
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")){if(e.key==="Escape")e.target.blur();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-5]$/.test(e.key)){e.preventDefault();state.scene=+e.key-1;render();}
  else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const seq=(state.scene===0?["0"]:[]).concat(LEVELS);let i=seq.indexOf(state.level);
    i=Math.max(0,Math.min(seq.length-1,i+(e.key==="ArrowRight"?1:-1)));stopPlay();state.level=seq[i];render();e.preventDefault();}
  else if(e.key==="ArrowDown"){step(1);e.preventDefault();} else if(e.key==="ArrowUp"){step(-1);e.preventDefault();}
  else if(e.key===" "&&state.scene<2){togglePlay();e.preventDefault();}
  else if(e.key.toLowerCase()==="r"&&state.scene<2)randomPick();
});
buildNav(); render();
</script>
