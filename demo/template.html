<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLN600 Repair Demo</title>
<style>
/*__FONTS__*/
/* The look follows the submitted paper on purpose: its fonts (TeX Gyre Termes = Nimbus Roman, Inconsolata),
   a white page with black rules and booktabs tables, and figures drawn by matplotlib in the style of its
   Figure 2 (Okabe-Ito colours, one marker per method). Damage levels use the viridis colours of its Figure 1. */
:root{
  --ink:#0b0b0b; --ink2:#333; --muted:#52514e; --rule:#0b0b0b; --hair:#c8c8c8; --hl:#f2f2f2;
  --ok:#00704f; --no:#b5450b;
  --serif:"TeX Gyre Termes", "Nimbus Roman", Times, "Times New Roman", serif;
  --mono:Inconsolata, Menlo, Consolas, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid #0072B2;outline-offset:2px}

header{padding:12px 32px 10px;border-bottom:1px solid var(--rule)}
header h1{font-size:20px;font-weight:700;margin:0}
header h1 small{font-weight:400;font-size:16px;color:var(--muted);margin-left:10px}
main{max-width:1320px;margin:0 auto;padding:16px 32px 96px}

/* one step: kicker, claim, why, controls, visual, notes */
.kicker{color:var(--muted);font-size:18px;margin:0 0 2px}
.claim{font-size:36px;line-height:1.15;font-weight:700;margin:0 0 6px;max-width:1200px}
.why{font-size:20px;color:var(--ink2);margin:0 0 14px;max-width:1200px}
.why b{font-weight:700;color:var(--ink)}
.sub{font-size:19px;color:var(--ink2);margin:12px 0 0;max-width:1200px}
.cap{font-size:16px;color:var(--muted);margin:8px 0 0;max-width:1200px}
.todo{margin:16px 0 0;max-width:1200px;background:#ffbf80;border:1px solid #ff8000;padding:6px 10px;font-size:16px;line-height:1.3}

/* controls: small, plain rectangles */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;margin:0 0 12px;font-size:16px}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group > .t{font-variant:small-caps;letter-spacing:.04em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;border-right:1px solid var(--ink);background:#fff;padding:2px 10px;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg .lv{display:inline-block;width:10px;height:10px;border:1px solid rgba(0,0,0,.25)}
.btn{border:1px solid var(--ink);background:#fff;padding:2px 10px;font-size:16px}
.btn:hover:not(:disabled),.seg button:hover{background:var(--hl)}
.seg button[aria-pressed=true]:hover{background:var(--ink)}
select,input[type=text]{border:1px solid var(--ink);background:#fff;padding:2px 6px;font-size:16px;border-radius:0}
label.chk{display:inline-flex;align-items:center;gap:6px}
.sid{font-family:var(--mono);font-size:15px;color:var(--muted)}

/* step 1: the sentence */
.sentence{font-size:30px;line-height:2;margin:0;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tok{padding:1px 2px;white-space:nowrap}
.tok.dmg,.tok.drop{font-family:var(--mono);font-size:28px;padding:2px 5px}
.tok.drop{color:var(--muted)}
.tok.anchor,.w.anchor{outline:1.5px solid var(--ink);outline-offset:1px}
.key{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px;font-size:16px;color:var(--muted)}
.key i{display:inline-block;width:18px;height:13px;vertical-align:-1px;margin-right:6px}

/* booktabs tables */
table.bt{border-collapse:collapse;font-variant-numeric:tabular-nums;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
table.bt th{font-weight:400;text-align:left;padding:4px 12px;border-bottom:.75px solid var(--rule);white-space:nowrap}
table.bt td{padding:5px 12px;vertical-align:middle}
table.bt .r{text-align:right}
table.bt tr.mid td{border-top:.75px solid var(--rule)}
table.race{width:100%}
table.race td.m{white-space:nowrap;width:1%}
table.race td.m small{display:block;color:var(--muted);font-size:14px;margin-left:34px}
table.race tr.gold td{background:var(--hl)}
table.race tr.abl td{color:var(--muted)}
td.hi{font-weight:700}
.sw{display:inline-block;vertical-align:middle;margin-right:8px}
.span-line{font-size:23px;line-height:1.5}
.span-line .ctx{color:#8a8a8a}
.w{padding:0 2px}
.w.ok{color:var(--ok)}
.w.no{color:var(--no)}
.w.ok::after{content:"\2713";font-size:.6em;vertical-align:super;margin-left:1px}
.w.no::after{content:"\2717";font-size:.6em;vertical-align:super;margin-left:1px}
.w.dmgv{font-family:var(--mono);font-size:.95em;background:var(--hl);color:var(--ink2)}
.w.empty{font-family:var(--mono);font-size:.85em}
.fail{font-style:italic;color:var(--no);font-size:17px;margin-right:8px}
.yes{color:var(--ok)} .nope{color:var(--no)}

/* figures and side panels */
.fig svg{display:block;width:100%;height:auto;max-height:52vh}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.side{border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
.hyp{display:block;width:100%;text-align:left;background:#fff;border:0;border-top:.75px solid var(--hair);padding:8px 10px 9px 12px;border-left:3px solid transparent}
.hyp:first-child{border-top:0}
.hyp[aria-pressed=true]{border-left-color:var(--ink);background:var(--hl)}
.hyp.off{opacity:.4}
.hyp b{font-size:18px}
.hyp em{margin-left:6px;font-size:16px}
.hyp p{margin:3px 0 0;font-size:15.5px;color:var(--ink2)}
.big{font-size:44px;line-height:1.1}
.side .pad{padding:8px 10px}
.side .lab{color:var(--muted);font-size:15px}

/* lookup */
.lookup{display:grid;grid-template-columns:minmax(0,500px) 1fr;gap:32px;align-items:start}
.lookup input{font-family:var(--mono);font-size:30px;padding:6px 12px;width:100%}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.presets button{font-family:var(--mono);font-size:16px}
table.cands{width:100%}
table.cands td.wd{font-size:24px}
table.cands tr:nth-child(2) td{font-weight:700}
.explain p{margin:0 0 10px;font-size:18px}
.explain code{font-family:var(--mono)}

/* summary */
ul.take{font-size:25px;line-height:1.35;margin:4px 0 0;padding-left:1.1em}
ul.take li{margin:0 0 12px}
.lim{font-size:18px;color:var(--muted);margin-top:18px;border-top:.75px solid var(--hair);padding-top:10px}

/* the bar at the bottom: back, the six steps, next */
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--rule);padding:8px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:7}
nav.bar .seg button{font-size:17px}
nav.bar .grow{flex:1}
nav.bar .pos{color:var(--muted);font-size:15px;margin:0 6px}
@media (max-height:820px){.claim{font-size:31px}.why{font-size:18px;margin-bottom:10px}.sentence{font-size:26px}.tok.dmg,.tok.drop{font-size:24px}.span-line{font-size:20px}.fig svg{max-height:48vh}}
@media (max-width:1100px){.two,.lookup{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>How Much Damage Can GenAI Repair?<small>Dippold, Tan, Manzenberger · University of Regensburg</small></h1></header>
<main id="main"></main>
<nav class="bar" id="bar" aria-label="Steps"></nav>
<script>
const DATA=/*__PAYLOAD__*/null;
</script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------- setup
// Okabe-Ito and markers as in the paper's Figure 2; the two ablations take the remaining Okabe-Ito colours.
const COLORS={bertdict:"#0072B2",llm:"#D55E00",lookup:"#E69F00",bart:"#009E73",bert:"#56B4E9",llmart:"#CC79A7",none:"#52514e"};
const MARK={bertdict:"o",llm:"s",lookup:"^",bart:"D",bert:"o-",llmart:"s-",none:""};
const DASH={bertdict:"",llm:"",lookup:"",bart:"",bert:"6 4",llmart:"6 4",none:"5 4"};
// viridis as in the paper's Figure 1: level colour and a light tint for the damaged words
const LEVEL_COL={"1w":["#bddf26","#ebf5be"],"10":["#44bf70","#c7ecd4"],"25":["#21918c","#bcdedd"],"50":["#355f8d","#c2cfdd"],"75":["#482475","#c8bdd6"]};
const LEVEL_NAME={"0":"clean","1w":"1 word","10":"10%","25":"25%","50":"50%","75":"75%"};
const LEVELS=DATA.levels, M=DATA.methods, MK=M.map(m=>m.key), MAIN=["bertdict","llm","lookup","bart"], ABL=["bert","llmart"];
const MNAME=Object.fromEntries(M.map(m=>[m.key,m.name])); MNAME.none="No repair";
const MROLE=Object.fromEntries(M.map(m=>[m.key,m.role]));
const S=DATA.sentences, byId=Object.fromEntries(S.map((s,i)=>[s.id,i]));
const HAS_FIGS=!!(DATA.figs&&DATA.figs.metric);
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){
  if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
  else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);} for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));} return e;};
const svgEl=(tag,attrs={})=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e;};
const fmt=(v,d=2)=>v==null||Number.isNaN(v)?"–":(v<0?"−":"")+Math.abs(v).toFixed(d);
const pct=v=>v==null?"–":Math.round(v*100)+"%";
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const range=(a,d=0)=>{const lo=Math.min(...a),hi=Math.max(...a);return lo===hi?fmt(lo,d):`${fmt(lo,d)} to ${fmt(hi,d)}`;};
const nRight=r=>r.ok.filter(Boolean).length;
const add=(root,...kids)=>root.append(...kids.flat().filter(k=>k!=null)); // DOM append would print null as "null"
function figure(svgText){const d=el("div",{class:"fig"});d.innerHTML=svgText||"<p>Figure not built (run build_demo.py --bertscore).</p>";return d;}

function marker(kind,cx,cy,r,col){
  const hollow=kind.endsWith("-"), k=kind.replace("-",""), a={fill:hollow?"#fff":col,stroke:col,"stroke-width":hollow?1.6:1};
  if(k==="s")return svgEl("rect",{x:cx-r*.9,y:cy-r*.9,width:r*1.8,height:r*1.8,...a});
  if(k==="^")return svgEl("polygon",{points:`${cx},${cy-r*1.15} ${cx-r*1.05},${cy+r*.75} ${cx+r*1.05},${cy+r*.75}`,...a});
  if(k==="D")return svgEl("polygon",{points:`${cx},${cy-r*1.2} ${cx+r},${cy} ${cx},${cy+r*1.2} ${cx-r},${cy}`,...a});
  if(k==="o")return svgEl("circle",{cx,cy,r,...a});
  return null;
}
function swatch(k){ // a short line with the method's marker, as in the figure legends
  const s=svgEl("svg",{width:26,height:14,viewBox:"0 0 26 14",class:"sw"});
  s.append(svgEl("line",{x1:1,x2:25,y1:7,y2:7,stroke:COLORS[k],"stroke-width":k==="none"?1.5:2,"stroke-dasharray":DASH[k]}));
  const m=marker(MARK[k],13,7,4,COLORS[k]); if(m)s.append(m); return s;
}

// ------------------------------------------------------------------------------------------- state
const DMG_SEQ=["0"].concat(LEVELS);
const state={step:0,dmg:0,reveal:false,idx:byId[DATA.talk.id]??0,level:DATA.talk.level,filter:"all",abl:false,
  metric:"frr",hyp:null,tMethod:DATA.talk.trap_method,tLevel:DATA.talk.level,lookupWord:"Hacley",playing:null};
// Open points for the team, drawn like LaTeX todonotes. Set REVIEW to false (or press N) once they are settled.
let REVIEW=true;
const REVIEW_NOTES={
  "1":"Wording OK? 'Anchor fact' = the one fact we track in each sentence; say this aloud.",
  "2a":"Hand-picked example, chosen because it shows the effect. Say aloud that it is one sentence; the averages follow in step 3. OK to show it?",
  "2b":"BART gets 6 of 9 words right, BERT + dict. only 3 of 9, so BART's higher BERTScore is partly deserved. Our point is only that the wrong name hardly costs anything. Agree with this framing?",
  "3":"'About half': BERT + dict. anchor 53 to 58%, Fact Recovery Rate 48 to 58%. The LLM's drop is partly format failures (scored as no repair). OK?",
  "4":"Opens on BART at 25% (BART is descriptive in the paper). Open on BERT + dict. instead (rate 0.33 there)?",
  "6":"Our interpretation (paper, conclusion: 'the letters carry most of this'): the lookup alone restores 51% of anchors, BERT + dict. 53 to 58%. OK as the closing message?"};
const reviewNote=key=>REVIEW&&REVIEW_NOTES[key]?el("div",{class:"todo"},el("b",{text:"To confirm: "}),REVIEW_NOTES[key]):null;

// --------------------------------------------------------------------------------- sentence choice
const FILTERS={
  all:{name:`All ${S.length} test sentences`,f:()=>true},
  bertwin:{name:"Anchor: BERT + dict. right, LLM wrong",f:(s,lv)=>s.repairs[lv].bertdict.anchor&&!s.repairs[lv].llm.anchor},
  llmwin:{name:"Anchor: LLM right, BERT + dict. wrong",f:(s,lv)=>s.repairs[lv].llm.anchor&&!s.repairs[lv].bertdict.anchor},
  fail:{name:"LLM format failure",f:(s,lv)=>!s.repairs[lv].llm.fmt},
  bartwrong:{name:"BART: wrong anchor",f:(s,lv)=>!s.repairs[lv].bart.anchor&&s.repairs[lv].bart.fmt},
  nobody:{name:"No method restores the anchor",f:(s,lv)=>MK.every(k=>!s.repairs[lv][k].anchor)},
};
function pool(){return S.map((s,i)=>i).filter(i=>FILTERS[state.filter].f(S[i],state.level));}
function stepSentence(d){const p=pool();if(!p.length)return;let pos=p.indexOf(state.idx);pos=pos<0?0:(pos+d+p.length)%p.length;state.idx=p[pos];render();}
function randomSentence(){const p=pool();if(p.length)state.idx=p[Math.floor(Math.random()*p.length)];render();}
function sentencePicker(){
  const s=S[state.idx], p=pool(), pos=p.indexOf(state.idx);
  return el("div",{class:"group"},el("span",{class:"t",text:"sentence"}),
    el("button",{class:"btn","aria-label":"Previous sentence",onclick:()=>stepSentence(-1)},"‹"),
    el("button",{class:"btn","aria-label":"Next sentence",onclick:()=>stepSentence(1)},"›"),
    el("button",{class:"btn",onclick:randomSentence},"random"),
    el("select",{"aria-label":"Which sentences to step through",onchange:e=>{state.filter=e.target.value;const q=pool();if(q.length&&!q.includes(state.idx))state.idx=q[0];render();}},
      ...Object.entries(FILTERS).map(([k,f])=>el("option",{value:k,selected:k===state.filter},f.name))),
    el("span",{class:"sid",text:`${s.id}${pos<0?"":` (${pos+1}/${p.length})`}`}),
    state.idx!==byId[DATA.talk.id]?el("button",{class:"btn",onclick:()=>{state.idx=byId[DATA.talk.id];state.filter="all";render();}},"back to the example"):null);
}
function levelButtons(lvls,cur,onpick){
  return el("div",{class:"seg",role:"group","aria-label":"Damage level"},...lvls.map(l=>el("button",{"aria-pressed":String(cur===l),onclick:()=>onpick(l)},
    LEVEL_COL[l]?el("span",{class:"lv",style:`background:${LEVEL_COL[l][0]}`}):null,LEVEL_NAME[l])));
}
function stopPlay(){if(state.playing){clearInterval(state.playing);state.playing=null;}}
function play(){ // step 1: through the damage levels, one per 1.5 s
  if(state.playing){stopPlay();render();return;}
  if(state.dmg>=DMG_SEQ.length-1)state.dmg=0;
  state.playing=setInterval(()=>{if(state.dmg>=DMG_SEQ.length-1){stopPlay();render();return;}state.dmg++;render();},1500);
  render();
}

// ------------------------------------------------------------------------------- span rendering
function spanTokens(s,lv,words,ok,ctx=1){
  const L=s.levels[lv], [a,b]=L.span, wrap=el("div",{class:"span-line"});
  const slotIdx=Object.fromEntries(L.slots.map((x,j)=>[x[0],j]));
  const from=Math.max(0,a-ctx), to=Math.min(s.tokens.length,b+ctx);
  if(from>0)wrap.append(el("span",{class:"ctx",text:"… "}));
  for(let i=from;i<to;i++){
    const j=slotIdx[i];
    if(j==null){wrap.append(el("span",{class:"ctx",text:s.tokens[i]})," ");continue;}
    if(words===undefined){wrap.append(el("span",{class:"w"+(i===s.anchor?" anchor":""),text:s.tokens[i]})," ");continue;}
    const w=words?words[j]:null, good=ok?ok[j]:0;
    const shown=w==null?(L.slots[j][2]?"⟨?⟩":L.slots[j][1]):(w===""?"∅":w);
    const cls=words===null?"dmgv":(good?"ok":"no"); // words === null: the damaged text itself, no marks
    wrap.append(el("span",{class:"w "+cls+(i===s.anchor?" anchor":"")+(w===""?" empty":""),title:`gold: ${s.tokens[i]}`,text:shown})," ");
  }
  if(to<s.tokens.length)wrap.append(el("span",{class:"ctx",text:"…"}));
  return wrap;
}

// ------------------------------------------------------------------------------------ the six steps
const STEPS=["Damage","Repairs","Results","BERTScore","Lookup","Summary"];
function head(n,claim,why){return [el("div",{class:"kicker",text:`Step ${n} of 6 · ${STEPS[n-1]}`}),el("h2",{class:"claim",text:claim}),why?el("p",{class:"why"},el("b",{text:"Why: "}),why):null];}

function stepDamage(root){
  const s=S[state.idx], lv=DMG_SEQ[state.dmg], L=lv==="0"?null:s.levels[lv], tint=L?LEVEL_COL[lv][1]:null;
  const slots=L?Object.fromEntries(L.slots.map(([i,out,d])=>[i,{out,d}])):{};
  const sent=el("p",{class:"sentence"});
  s.tokens.forEach((t,i)=>{const sl=slots[i];
    sent.append(el("span",{class:"tok"+(sl?(sl.d?" drop":" dmg"):"")+(i===s.anchor?" anchor":""),style:sl?`background:${tint}`:null,
      title:sl?`gold: ${t}`:null,text:sl?(sl.d?"⟨?⟩":sl.out):t})," ");});
  const k=L?L.slots.length:0, nd=L?L.slots.filter(x=>x[2]).length:0;
  add(root,...head(1,"We damage one fact and the words around it, from one word to 75% of the sentence",
      "Real damaged pages have no known original text. Damaging clean text ourselves lets us set how much is broken and know the right answer. The letter changes copy the OCR errors found in BLN600 itself."),
    el("div",{class:"controls"},sentencePicker(),
      el("div",{class:"group"},el("span",{class:"t",text:"damage"}),levelButtons(DMG_SEQ,lv,l=>{stopPlay();state.dmg=DMG_SEQ.indexOf(l);render();}),
        el("button",{class:"btn",onclick:play},state.playing?"stop":"play"))),
    sent,
    el("div",{class:"key"},el("span",{},el("i",{style:`background:${tint||LEVEL_COL["25"][1]}`}),"damaged word, as every method sees it"),
      el("span",{},"⟨?⟩ word dropped, no letters left"),el("span",{},el("i",{style:"outline:1.5px solid #0b0b0b;outline-offset:-2px"}),"anchor fact (the one fact we track)")),
    el("p",{class:"sub",text:L?`${LEVEL_NAME[lv]}: ${k} of ${s.tokens.length} words damaged${nd?`, ${nd} dropped`:""}, character error rate of the span ${pct(L.cer)}. `+
      "A word looks the same at every level; a higher level only adds damaged words around the anchor."
      :"A sentence from a London crime report, 1834 to 1894 (BLN600 corpus). Click play or next to damage it."}),
    reviewNote("1"));
}

function stepRepairs(root){
  if(state.level==="0")state.level="1w";
  const s=S[state.idx], lv=state.level, R=s.repairs[lv], L=s.levels[lv], bs=state.reveal&&DATA.meta.bertscore;
  const right=MAIN.filter(k=>R[k].anchor).map(k=>MNAME[k]);
  const showcase=!R.bart.anchor&&R.bertdict.anchor&&R.bart.bs>R.bertdict.bs;
  const claim=bs
    ?(showcase?`BERTScore rates BART higher (${fmt(R.bart.bs)}) than BERT + dict. (${fmt(R.bertdict.bs)}), although BART got the fact wrong`
      :"BERTScore scores the whole span, not whether the fact is right")
    :`All methods get the same damaged sentence. Here, ${right.length?(right.length===MAIN.length?"all":"only")+" "+right.join(", "):"no method"} ${right.length===1?"gets":"get"} the boxed fact right`;
  const keys=MAIN.concat(state.abl?ABL:[]);
  const th=el("tr",{},el("th",{text:"Method"}),el("th",{text:`Repaired span, ${LEVEL_NAME[lv]} damage`}),el("th",{class:"r",text:"Fact"}),el("th",{class:"r",text:"Words right"}),bs?el("th",{class:"r",text:"BERTScore"}):null);
  const rows=[el("tr",{class:"gold"},el("td",{class:"m"},el("span",{style:"display:inline-block;width:34px"}),"Gold"),el("td",{},spanTokens(s,lv,undefined,null)),el("td",{}),el("td",{}),bs?el("td",{}):null),
    el("tr",{},el("td",{class:"m"},swatch("none"),"Damaged input"),el("td",{},spanTokens(s,lv,null,null)),el("td",{}),el("td",{}),bs?el("td",{class:"r",text:fmt(L.bs_none)}):null)];
  keys.forEach((k,n)=>{const r=R[k];rows.push(el("tr",{class:(n===0?"mid":"")+(ABL.includes(k)?" abl":"")},
    el("td",{class:"m"},swatch(k),MNAME[k],ABL.includes(k)?el("small",{text:MROLE[k]}):null),
    el("td",{},r.fmt?null:el("span",{class:"fail",text:"format failure:"}),spanTokens(s,lv,r.fmt?r.w:null,r.ok)),
    el("td",{class:"r"},el("span",{class:r.anchor?"yes":"nope",text:r.anchor?"right":"wrong"})),
    el("td",{class:"r",text:`${nRight(r)} of ${r.ok.length}`}),
    bs?el("td",{class:"r"+(showcase&&(k==="bart"||k==="bertdict")?" hi":""),text:fmt(r.bs)}):null));});
  add(root,...head(2,claim,bs?"BERTScore is the usual score for generated text. It compares meaning, so a plausible wrong name costs little."
      :"Every method gets exactly the same input, so any difference comes from the method alone. Where the damage is, is given; finding it is a separate task we leave out."),
    el("div",{class:"controls"},sentencePicker(),
      el("div",{class:"group"},el("span",{class:"t",text:"damage"}),levelButtons(LEVELS,lv,l=>{state.level=l;render();})),
      el("label",{class:"chk"},el("input",{type:"checkbox",checked:state.reveal,onchange:e=>{state.reveal=e.target.checked;render();}}),"BERTScore"),
      el("label",{class:"chk"},el("input",{type:"checkbox",checked:state.abl,onchange:e=>{state.abl=e.target.checked;render();}}),"ablations")),
    el("table",{class:"bt race"},th,...rows),
    el("p",{class:"sub",text:bs&&showcase?`BART restores ${nRight(R.bart)} of ${R.bart.ok.length} words but not the fact; BERT + dict. ${nRight(R.bertdict)} of ${R.bertdict.ok.length}, including the fact. A span-level score counts the fact as one word among many.`
      :`Green: restored exactly; red: wrong; box: the anchor fact. One sentence only; over all ${S.length} sentences at ${LEVEL_NAME[lv]}, the anchor is restored by `+
        MAIN.map(k=>`${MNAME[k]} ${pct(mean(S.map(x=>x.repairs[lv][k].anchor)))}`).join(", ")+"."}),
    el("p",{class:"cap",text:"BERT + dict.: BERT fine-tuned on 19th-century newspaper text, choosing among its own guesses and the closest words of a word list. LLM: Qwen3-30B with five solved examples. Lookup: closest word in the list, no model. BART: a denoiser trained on our own damage, so its scores are optimistic."}),
    reviewNote(bs?"2b":"2a"));
}

const HYPS=[
  {id:"H1",vtext:"partly supported (descriptively)",text:"Quality falls as damage grows, but Fact Recovery Rate does not fall faster than BERTScore (BERT + dict.: FRR 0.58 to 0.48, span BERTScore 0.77 to 0.40).",metric:"frr",uses:["frr","bs","exact"]},
  {id:"H2",vtext:"not supported for the tested pair",text:"The few-shot LLM never restores more facts than BERT + dictionary, and significantly fewer anchors at 50% and 75%.",metric:"anchor",uses:["anchor","bs","frr"]},
  {id:"H2b",vtext:"not supported for the tested pair",text:"The LLM does not beat the dictionary lookup on facts at any level and loses to it at 50% and 75%.",metric:"anchor",uses:["anchor","bs","frr"]},
  {id:"H3",vtext:"supported beyond one word",text:"A wrong-fact repair scores at least as high in span BERTScore as a right-fact repair in 11% to 45% of pairs. Click again for step 4.",metric:"bs",uses:["bs","anchor"]},
];
const METRIC_NAMES={frr:"Fact Recovery Rate",anchor:"Anchor recovery",bs:"Span BERTScore",exact:"Exact words",cer:"Span CER"};
function stepResults(root){
  const a=k=>LEVELS.map(l=>DATA.ci.anchor[k][l][0]);
  const sig=DATA.tests.filter(q=>q.pair[0]==="bertdict"&&q.pair[1]==="llm"&&q.mcnemar_holm<0.05).map(q=>LEVEL_NAME[q.level]);
  // p-values exist for the two tested pairs (H2, H2b) on anchor recovery (McNemar) and span BERTScore (Wilcoxon)
  const figKey=(state.hyp==="H2"||state.hyp==="H2b")&&(state.metric==="anchor"||state.metric==="bs")?`${state.metric}_${state.hyp}`:state.metric;
  const usedBy=HYPS.filter(h=>h.uses.includes(state.metric)).map(h=>h.id);
  const fails=DATA.valid.llm;
  // a hypothesis is selected (clicked), related (uses the shown measure) or faded
  const side=el("div",{class:"side"},...HYPS.map(h=>el("button",{class:"hyp"+(usedBy.includes(h.id)?"":" off"),"aria-pressed":String(state.hyp===h.id),onclick:()=>{
      if(state.hyp===h.id){if(h.id==="H3"){go(3);return;}state.hyp=null;render();return;}
      state.hyp=h.id; state.metric=h.metric; render();}},
    el("b",{text:h.id}),el("em",{text:h.vtext}),el("p",{text:h.text}))));
  add(root,...head(3,"Even the best method restores only about half of the facts, at every damage level",
      "We count exact facts (names, places, numbers) because a fluent wrong name is worse than visible noise: the reader no longer sees that anything was damaged."),
    el("div",{class:"controls"},el("div",{class:"group"},el("span",{class:"t",text:"measure"}),el("div",{class:"seg"},...Object.entries(METRIC_NAMES).map(([k,n])=>
      el("button",{"aria-pressed":String(state.metric===k),onclick:()=>{state.metric=k;
        if(state.hyp&&!HYPS.find(h=>h.id===state.hyp).uses.includes(k))state.hyp=null;render();}},n)))),
      el("span",{class:"t",text:usedBy.length?`used by ${usedBy.join(", ")}`:"secondary measure (ablation only), no hypothesis"})),
    el("div",{class:"two"},figure(HAS_FIGS?DATA.figs.metric[figKey]:null),side),
    el("p",{class:"sub",text:`Repair does not suddenly collapse at any level. Anchor restored, 1 word to 75%: BERT + dict. ${pct(a("bertdict")[0])} to ${pct(a("bertdict")[4])}, `+
      `lookup ${range(a("lookup").map(v=>v*100))}%, LLM ${pct(a("llm")[0])} to ${pct(a("llm")[4])}, significantly below BERT + dict. at ${sig.join(" and ")}. `+
      `The LLM's drop goes with answers in the wrong format: ${fails["50"].fail+fails["75"].fail} of 300 at 50% and 75% (dotted line: the LLM over its valid answers only).`}),
    el("p",{class:"cap",text:`150 test sentences per level, 95% bootstrap intervals over sentences, from the single test run (notebook 4; paper, Table 6 and Fig. 2). `+
      `Click a hypothesis to see its measure; H2 and H2b also show their paired test above each level. Contamination probe: ${DATA.probe.near} of ${DATA.probe.n} test sentences continued near-verbatim by the LLM.`}),
    reviewNote("3"));
}

function stepBertscore(root){
  const mk=state.tMethod, lv=state.tLevel, rate=DATA.sq3[mk]?DATA.sq3[mk][lv]:null;
  const all=MAIN.flatMap(k=>LEVELS.slice(1).map(l=>DATA.sq3[k][l]));
  const wrongHigh=S.map(s=>({s,r:s.repairs[lv][mk]})).filter(o=>!o.r.anchor&&o.r.fmt&&o.r.bs!=null).sort((x,y)=>y.r.bs-x.r.bs).slice(0,6);
  const anchorWord=o=>{const L=o.s.levels[lv], j=L.slots.findIndex(x=>x[0]===o.s.anchor);return o.r.w[j]||"∅";};
  const side=el("div",{class:"side"},
    el("div",{class:"pad"},el("div",{class:"lab",text:`Chance that a wrong-fact repair scores at least as high as a right-fact one (${MNAME[mk]}, ${LEVEL_NAME[lv]})`}),
      el("div",{class:"big",text:fmt(rate)}),el("div",{class:"lab",text:"0 = BERTScore always ranks the right fact higher, 0.5 = it cannot tell"})),
    el("div",{class:"pad lab",text:"Wrong facts with the highest BERTScore"}),
    el("table",{class:"bt",style:"width:100%;border-bottom:0"},el("tr",{},el("th",{text:"Gold"}),el("th",{text:"Repair"}),el("th",{class:"r",text:"Score"})),
      ...wrongHigh.map(o=>el("tr",{},el("td",{text:o.s.tokens[o.s.anchor]}),el("td",{class:"nope",text:anchorWord(o)}),el("td",{class:"r",text:fmt(o.r.bs)})))));
  add(root,...head(4,"BERTScore often cannot tell a repair with the wrong fact from one with the right fact",
      "BERTScore is the usual score for generated text. Before trusting it, we check whether it notices a wrong fact."),
    el("div",{class:"controls"},
      el("div",{class:"group"},el("span",{class:"t",text:"method"}),el("div",{class:"seg"},...MAIN.map(k=>el("button",{"aria-pressed":String(mk===k),onclick:()=>{state.tMethod=k;render();}},MNAME[k])))),
      el("div",{class:"group"},el("span",{class:"t",text:"damage"}),levelButtons(LEVELS.slice(1),lv,l=>{state.tLevel=l;render();}))),
    el("div",{class:"two"},figure(HAS_FIGS?DATA.figs.strip[`${mk}|${lv}`]:null),side),
    el("p",{class:"sub",text:`Each dot is one repair; circled: the example from step 2. If BERTScore noticed wrong facts, the lower dots would lie far to the left. They overlap. `+
      `Over the four methods beyond one word, the chance above is ${range(all,2)}.`}),
    el("p",{class:"cap",text:"Repairs come from different sentences, so this ranks repairs rather than swapping one name in the same sentence (paper, Sec. 4.2)."}),
    reviewNote("4"));
}

let LEX=null;
function lev(a,b,cap){ // Levenshtein with an early exit above cap
  const n=a.length,m=b.length; if(Math.abs(n-m)>cap)return cap+1;
  let prev=new Array(m+1); for(let j=0;j<=m;j++)prev[j]=j;
  for(let i=1;i<=n;i++){const cur=[i];let best=i;for(let j=1;j<=m;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<best)best=cur[j];}
    if(best>cap)return cap+1; prev=cur;}
  return prev[m];}
function byRank(a,b){return a[1]-b[1]||b[2]-a[2]||(a[0]<b[0]?-1:a[0]>b[0]?1:0);}
function nearest(q,n=8){ const out=[]; let cap=Math.max(3,Math.ceil(q.length*0.6));
  for(const [w,c] of LEX){const d=lev(q,w,cap); if(d<=cap){out.push([w,d,c]); if(out.length>400){out.sort(byRank);out.length=n;cap=out[out.length-1][1];}}}
  out.sort(byRank); return out.slice(0,n);}
function stepLookup(root){
  add(root,...head(5,`A plain dictionary lookup already restores ${pct(DATA.ci.anchor.lookup["1w"][0])} of the anchor facts`,
    "To see whether GenAI beats a spell checker, we compare it with a lookup that uses no model at all."));
  if(!DATA.lexicon){add(root,el("p",{text:"The word list was not built (data/raw/BLN600 missing when the demo was built)."}));return;}
  LEX=LEX||DATA.lexicon;
  const s=S[state.idx], L=s.levels[state.level];
  const presets=[...new Set(L.slots.filter(x=>!x[2]).map(x=>x[1].replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"")).filter(Boolean))].slice(0,6);
  const input=el("input",{type:"text",value:state.lookupWord,placeholder:"type a damaged word","aria-label":"Damaged word",spellcheck:"false",autocomplete:"off"});
  const list=el("table",{class:"bt cands"});
  const run=()=>{state.lookupWord=input.value.trim(); const res=state.lookupWord?nearest(state.lookupWord):[];
    list.replaceChildren(el("tr",{},el("th",{text:"List word"}),el("th",{class:"r",text:"Letters changed"}),el("th",{class:"r",text:"Count in list"})),
      ...res.map(([w,d,c])=>el("tr",{},el("td",{class:"wd",text:w}),el("td",{class:"r",text:String(d)}),el("td",{class:"r",text:c.toLocaleString("en-US")}))));};
  input.addEventListener("input",run);
  add(root,el("div",{class:"lookup"},
    el("div",{},input,el("div",{class:"presets"},...["Hacley","Wrighb"].concat(presets).map(p=>el("button",{class:"btn",onclick:()=>{input.value=p;run();input.focus();}},p))),list),
    el("div",{class:"explain"},
      el("p",{},"This is the whole method: the closest spelling in a list of ",el("b",{text:`${LEX.length.toLocaleString("en-US")} words`}),
        " from other BLN600 articles; ties go to the more frequent word. It restores the anchor in the same share of sentences at every level, because the anchor's damage is the same at every level and the lookup ignores the context."),
      el("p",{},"BERT + dict. adds the ",el("code",{text:"5"})," closest list words to BERT's own guesses and weighs letter similarity heavily (",el("code",{text:"λ = 64"}),
        "): the letters decide most words, and the context breaks near ties and fills dropped words. That is why it is only a little better than the lookup."),
      el("p",{},"The lookup fails when the right word is missing from the list: only 77% of the damaged fact words are in it. Hacley (gold Hanley) shows this: Hanley is not in the list. Wrighb (gold Wright) is the paper's example. The other presets are the damaged words of the current sentence."))));
  run();
}

function stepSummary(root){
  const meta=DATA.meta;
  add(root,...head(6,"Most of the repair comes from the garbled letters, not from the context",null),
    el("ul",{class:"take"},
      el("li",{},el("b",{text:"H1, partly: "}),"quality falls with damage, but facts do not fall faster than BERTScore."),
      el("li",{},el("b",{text:"H2 and H2b, not supported: "}),"the few-shot LLM restores no more facts than BERT + dictionary or a plain lookup."),
      el("li",{},el("b",{text:"H3, supported beyond one word: "}),"BERTScore overstates repair; report a fact-level score next to it."),
      el("li",{},el("b",{text:"In practice: "}),"show repairs as marked suggestions with alternatives; the historian decides, the model does not overwrite the text.")),
    el("p",{class:"lim",text:"Limits: synthetic damage in a known span, one LLM, one prompt, one damage draw and one training seed; real damaged pages remain untested. "+
      `Data: ${meta.verified?"frozen damaged test split, hash verified":"UNVERIFIED test build"}; ${meta.mismatches.length?`${meta.mismatches.length} of ${meta.checked} recomputed means DIFFER from`:`all ${meta.checked} recomputed means match`} the paper's test run.`}),
    reviewNote("6"));
}

// --------------------------------------------------------------------------------- navigation
const RENDER=[stepDamage,stepRepairs,stepResults,stepBertscore,stepLookup,stepSummary];
const subCount=i=>i===0?DMG_SEQ.length:i===1?2:1;
const TOTAL=STEPS.reduce((n,_,i)=>n+subCount(i),0);
const position=()=>[...Array(state.step).keys()].reduce((n,i)=>n+subCount(i),0)+(state.step===0?state.dmg:state.step===1&&state.reveal?1:0);
function go(i){stopPlay();state.step=i;state.dmg=0;state.reveal=false;render();}
function next(){stopPlay();
  if(state.step===0&&state.dmg<DMG_SEQ.length-1)state.dmg++;
  else if(state.step===1&&!state.reveal)state.reveal=true;
  else if(state.step<STEPS.length-1){state.step++;state.reveal=false;}
  render();}
function back(){stopPlay();
  if(state.step===1&&state.reveal)state.reveal=false;
  else if(state.step===0&&state.dmg>0)state.dmg--;
  else if(state.step>0){state.step--;if(state.step===0)state.dmg=DMG_SEQ.length-1;if(state.step===1)state.reveal=true;}
  render();}
function bar(){
  const pos=position();
  return [el("button",{class:"btn",onclick:back,disabled:pos===0},"‹ back"),
    el("div",{class:"seg",role:"group","aria-label":"Steps"},...STEPS.map((n,i)=>el("button",{"aria-pressed":String(state.step===i),onclick:()=>go(i)},`${i+1} ${n}`))),
    el("button",{class:"btn",onclick:next,disabled:pos===TOTAL-1},"next ›"),
    el("span",{class:"pos",text:`${pos+1}/${TOTAL}`}),
    el("span",{class:"grow"}),
    el("button",{class:"btn",onclick:()=>{REVIEW=!REVIEW;render();}},REVIEW?"hide notes (N)":"show notes (N)")];
}
let lastStep=null;
function render(){
  if(state.step!==lastStep){window.scrollTo(0,0);lastStep=state.step;}
  const main=$("#main"); main.replaceChildren(); RENDER[state.step](main);
  $("#bar").replaceChildren(...bar());
}
document.addEventListener("keydown",e=>{
  if(e.target.matches&&e.target.matches("input,select,textarea")){if(e.key==="Escape")e.target.blur();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(["ArrowRight","PageDown"," ","Enter"].includes(k))next();         // also a presenter's clicker
  else if(["ArrowLeft","PageUp","Backspace"].includes(k))back();
  else if(/^[1-6]$/.test(k))go(+k-1);
  else if(k==="Home")go(0);
  else if(k.toLowerCase()==="n"){REVIEW=!REVIEW;render();}
  else if(k.toLowerCase()==="p"&&state.step===0)play();
  else if(k.toLowerCase()==="r"&&state.step<2)randomSentence();
  else if(k==="ArrowDown"&&state.step<2)stepSentence(1);
  else if(k==="ArrowUp"&&state.step<2)stepSentence(-1);
  else return;
  e.preventDefault();
});
render();
</script>
