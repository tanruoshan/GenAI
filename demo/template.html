<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLN600 Repair Demo</title>
<style>
/* The look follows the submitted paper on purpose: ACL page (white, Times, black rules), booktabs tables,
   the matplotlib "science" style and Okabe-Ito colours of its Figure 2, viridis levels of its Figure 1. */
:root{
  --ink:#0b0b0b; --ink2:#333; --muted:#52514e; --rule:#0b0b0b; --hair:#c8c8c8; --grid:#dddddd;
  --ok:#00704f; --no:#b5450b; --hl:#f2f2f2;
  --serif:"Times New Roman", Times, "Nimbus Roman", "TeX Gyre Termes", "STIX Two Text", serif;
  --mono:Menlo, Consolas, "DejaVu Sans Mono", "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.4}
body{min-height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #0072B2;outline-offset:2px}

/* header: paper title and a plain list of the five parts */
header{display:flex;align-items:baseline;gap:28px;padding:14px 32px 0;border-bottom:1px solid var(--rule);background:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:20px;font-weight:700;margin:0 0 10px;white-space:nowrap}
header h1 small{font-weight:400;font-size:16px;color:var(--muted);margin-left:10px}
nav.scenes{display:flex;gap:22px;margin-left:auto}
nav.scenes button{background:none;border:0;border-bottom:3px solid transparent;padding:0 0 8px;font-size:18px;color:var(--muted)}
nav.scenes button .k{margin-right:6px}
nav.scenes button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

main{flex:1;padding:20px 32px 28px;max-width:1440px;width:100%;margin:0 auto}
section.scene{display:none}
section.scene.active{display:block}
h2{font-size:26px;font-weight:700;margin:0 0 12px}
h2 .no{display:inline-block;min-width:1.4em}
.cap{font-size:16.5px;line-height:1.4;color:var(--ink2);margin:10px 0 0;max-width:1180px;text-align:justify;hyphens:auto}
.cap b{font-weight:400;color:var(--ink)}

/* controls: plain rectangles, no rounding */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;margin:0 0 14px}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group > label.t{font-variant:small-caps;letter-spacing:.04em;color:var(--muted);margin-right:4px;font-size:17px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;border-right:1px solid var(--ink);background:#fff;padding:3px 11px;font-size:17px;display:inline-flex;align-items:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg .lv{display:inline-block;width:11px;height:11px;border:1px solid rgba(0,0,0,.25)}
.btn{border:1px solid var(--ink);background:#fff;padding:3px 11px;font-size:17px}
.btn:hover,.seg button:hover{background:var(--hl)}
.seg button[aria-pressed=true]:hover{background:var(--ink)}
select,input[type=text]{border:1px solid var(--ink);background:#fff;padding:3px 8px;font-size:17px;border-radius:0}
.sid{font-family:var(--mono);font-size:14px;color:var(--muted)}

/* scene 1: the sentence */
.sentence{font-size:27px;line-height:2;margin:4px 0 0;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tok{padding:1px 2px;white-space:nowrap}
.tok.dmg,.tok.drop{font-family:var(--mono);font-size:22px;padding:2px 5px}
.tok.drop{color:var(--muted)}
.tok.fact{text-decoration:underline dotted 2px;text-underline-offset:6px;text-decoration-color:#777}
.tok.anchor,.w.anchor{outline:1.5px solid var(--ink);outline-offset:1px}
.key{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px;font-size:16.5px;color:var(--ink2)}
.key i{display:inline-block;width:20px;height:14px;vertical-align:-2px;margin-right:6px}

/* booktabs tables */
table.bt{border-collapse:collapse;font-variant-numeric:tabular-nums;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
table.bt th{font-weight:400;text-align:left;padding:5px 14px 4px;border-bottom:.75px solid var(--rule);white-space:nowrap}
table.bt td{padding:5px 14px;vertical-align:middle}
table.bt td.r,table.bt th.r{text-align:right}
table.bt tr.mid td{border-top:.75px solid var(--rule)}
table.stats{margin-top:14px}
table.stats td{font-size:19px}

/* scene 2: repairs */
table.race{width:100%}
table.race td.m{white-space:nowrap;width:1%}
table.race td.m small{display:block;color:var(--muted);font-size:15px;margin-left:34px}
table.race tr.gold td{background:var(--hl)}
.sw{display:inline-block;vertical-align:middle;margin-right:8px}
.span-line{font-size:22px;line-height:1.75}
.span-line .ctx{color:#8a8a8a}
.w{padding:0 2px}
.w.ok{color:var(--ok)}
.w.no{color:var(--no)}
.w.ok::after{content:"\2713";font-size:.6em;vertical-align:super;margin-left:1px}
.w.no::after{content:"\2717";font-size:.6em;vertical-align:super;margin-left:1px}
.w.dmgv{font-family:var(--mono);font-size:.85em;background:var(--hl);color:var(--ink2)}
.w.empty{font-family:var(--mono);font-size:.8em}
.fail{font-style:italic;color:var(--no);font-size:17px;margin-right:8px}
.yes{color:var(--ok)} .nope{color:var(--no)}

/* charts */
.chartwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:30px;align-items:start}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;margin-top:2px}
.legend button{background:none;border:0;padding:2px 4px;font-size:17px;display:inline-flex;align-items:center}
.legend button[aria-pressed=false]{color:#aaa;text-decoration:line-through}
.legend button[aria-pressed=false] svg{opacity:.3}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--ink);padding:8px 10px;font-size:16px;min-width:240px;display:none;z-index:3}
.tip .lv{font-weight:700;margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .row small{color:var(--muted);font-variant-numeric:tabular-nums}
.hyps{border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
.hyp{display:block;width:100%;text-align:left;background:#fff;border:0;border-top:.75px solid var(--hair);padding:9px 10px 10px 12px;border-left:3px solid transparent}
.hyp:first-child{border-top:0}
.hyp[aria-pressed=true]{border-left-color:var(--ink);background:var(--hl)}
.hyp b{font-size:19px}
.hyp em{margin-left:8px}
.hyp p{margin:4px 0 0;font-size:16.5px;color:var(--ink2)}
.note{font-size:16.5px;color:var(--ink2);margin-top:10px}

/* scene 4 */
.trap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:30px;align-items:start}
.side{border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);padding:10px 0}
.side .lab{color:var(--muted);font-size:16px}
.big{font-size:44px;line-height:1.1}
.detail{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:.75px solid var(--hair)}
.detail .span-line{font-size:19px}

/* scene 5 */
.lookup{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:34px;align-items:start}
.lookup input{font-family:var(--mono);font-size:30px;padding:8px 12px;width:100%}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.presets button{font-family:var(--mono);font-size:15px}
table.cands{width:100%}
table.cands td.wd{font-size:24px}
table.cands tr:first-child td{font-weight:700}
.explain p{margin:0 0 10px}
.explain code{font-family:var(--mono);font-size:.85em}

/* talk mode: one claim per frame, large type, few controls */
body.talking header nav.scenes,body.talking footer{display:none}
body.talking header{border-bottom:0}
.talk{max-width:1280px;margin:0 auto}
.talk .kicker{color:var(--muted);font-size:20px;margin:6px 0 4px}
.talk .claim{font-size:40px;line-height:1.15;font-weight:700;margin:0 0 18px;max-width:1180px}
.talk .sub{font-size:22px;color:var(--ink2);margin:14px 0 0;max-width:1180px}
.talk .sentence{font-size:31px}
.talk .tok.dmg,.talk .tok.drop{font-size:26px}
.talk .fig svg{width:100%;height:auto;max-height:50vh;display:block}
.talk table.race .span-line{font-size:23px;line-height:1.5}
.talk table.race td{padding:7px 14px}
.talk .seg button{font-size:20px;padding:4px 14px}
.talk td.hi{font-weight:700;font-size:24px}
.talk ul.take{font-size:26px;line-height:1.35;margin:0;padding-left:1.1em}
.talk ul.take li{margin:0 0 12px}
.talk .lim{font-size:19px;color:var(--muted);margin-top:22px;border-top:.75px solid var(--hair);padding-top:10px}
.todo{margin:14px 0 30px;max-width:1180px;background:#ffbf80;border:1px solid #ff8000;padding:6px 10px;font-size:16px;line-height:1.3;z-index:6}
.progress{position:fixed;right:24px;bottom:14px;font-size:16px;color:var(--muted)}
footer{padding:10px 32px 16px;color:var(--muted);font-size:15px;max-width:1440px;margin:0 auto;width:100%;border-top:.75px solid var(--hair)}
kbd{font-family:var(--mono);font-size:13px;border:1px solid #999;padding:0 4px;background:#fff}
@media (max-height:860px){main{padding:12px 28px 18px}h2{font-size:23px;margin-bottom:8px}.cap{font-size:15.5px}
  .controls{margin-bottom:8px}table.race td{padding:3px 12px}.span-line{font-size:19px;line-height:1.55}.sentence{font-size:24px}.tok.dmg,.tok.drop{font-size:19px}}
@media (max-width:1100px){.chartwrap,.trap,.lookup{grid-template-columns:1fr}nav.scenes{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>How Much Damage Can GenAI Repair?<small>Dippold, Tan, Manzenberger</small></h1>
  <nav class="scenes" role="tablist" aria-label="Parts"></nav>
</header>
<main>
  <section id="s-talk"></section>
  <section class="scene" id="s-damage"></section>
  <section class="scene" id="s-repair"></section>
  <section class="scene" id="s-results"></section>
  <section class="scene" id="s-trap"></section>
  <section class="scene" id="s-lookup"></section>
</main>
<footer id="foot"></footer>
<script>
const DATA=/*__PAYLOAD__*/null;
</script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------- setup
// Okabe-Ito and markers as in the paper's Figure 2 (scripts/paper_results.py); the two ablations take the
// remaining Okabe-Ito colours and hollow markers.
const COLORS={bertdict:"#0072B2",llm:"#D55E00",lookup:"#E69F00",bart:"#009E73",bert:"#56B4E9",llmart:"#CC79A7",none:"#52514e"};
const MARK={bertdict:"o",llm:"s",lookup:"^",bart:"D",bert:"o-",llmart:"s-",none:""};
const DASH={bertdict:"",llm:"",lookup:"",bart:"",bert:"6 4",llmart:"6 4",none:"5 4"};
// viridis as in the paper's Figure 1 (level colour, and a light tint for the damaged words)
const LEVEL_COL={"1w":["#bddf26","#ebf5be"],"10":["#44bf70","#c7ecd4"],"25":["#21918c","#bcdedd"],"50":["#355f8d","#c2cfdd"],"75":["#482475","#c8bdd6"]};
const LEVEL_NAME={"0":"clean","1w":"1 word","10":"10%","25":"25%","50":"50%","75":"75%"};
const LEVELS=DATA.levels, M=DATA.methods, MK=M.map(m=>m.key);
const MNAME=Object.fromEntries(M.map(m=>[m.key,m.name])); MNAME.none="No repair";
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){
  if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
  else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);} for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));} return e;};
const svgEl=(tag,attrs={})=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e;};
const svgText=(attrs,text)=>{const t=svgEl("text",{"font-family":"Times New Roman, Times, serif",...attrs});t.textContent=text;return t;};
const fmt=(v,d=2)=>v==null||Number.isNaN(v)?"–":(v<0?"−":"")+Math.abs(v).toFixed(d);
const pct=v=>v==null?"–":Math.round(v*100)+"%";
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const S=DATA.sentences, byId=Object.fromEntries(S.map((s,i)=>[s.id,i]));

// a marker shape at (cx, cy): o circle, s square, ^ triangle, D diamond; a trailing "-" draws it hollow
function marker(kind,cx,cy,r,col){
  const hollow=kind.endsWith("-"), k=kind.replace("-",""), a={fill:hollow?"#fff":col,stroke:col,"stroke-width":hollow?1.6:1};
  if(k==="s")return svgEl("rect",{x:cx-r*.9,y:cy-r*.9,width:r*1.8,height:r*1.8,...a});
  if(k==="^")return svgEl("polygon",{points:`${cx},${cy-r*1.15} ${cx-r*1.05},${cy+r*.75} ${cx+r*1.05},${cy+r*.75}`,...a});
  if(k==="D")return svgEl("polygon",{points:`${cx},${cy-r*1.2} ${cx+r},${cy} ${cx},${cy+r*1.2} ${cx-r},${cy}`,...a});
  if(k==="o")return svgEl("circle",{cx,cy,r,...a});
  return null;
}
function swatch(k){ // legend swatch: a short line with the method's marker
  const s=svgEl("svg",{width:26,height:14,viewBox:"0 0 26 14",class:"sw"});
  s.append(svgEl("line",{x1:1,x2:25,y1:7,y2:7,stroke:COLORS[k],"stroke-width":k==="none"?1.5:2,"stroke-dasharray":DASH[k]}));
  const m=marker(MARK[k],13,7,4,COLORS[k]); if(m)s.append(m); return s;
}

const state={mode:DATA.figs&&DATA.figs.levels?"talk":"explore",frame:0,scene:0,idx:Math.max(0,byId[DATA.featured[0]]??0),level:"25",filter:"all",
  metric:"anchor",shown:new Set(["bertdict","llm","lookup","bart","none"]),validOnly:false,hyp:null,
  trapLevel:"25",trapMethod:"bart",trapSel:null,trapAll:false,lookupWord:"Hacley",full:false,playing:null};

// --------------------------------------------------------------------------------- sentence filters
const FILTERS={
  all:{name:`All ${S.length} test sentences`,f:()=>true},
  manual:{name:"Seeded manual check (6)",f:s=>DATA.featured.includes(s.id)},
  bertwin:{name:"Anchor: BERT + dict. right, LLM wrong",f:(s,lv)=>s.repairs[lv].bertdict.anchor&&!s.repairs[lv].llm.anchor},
  llmwin:{name:"Anchor: LLM right, BERT + dict. wrong",f:(s,lv)=>s.repairs[lv].llm.anchor&&!s.repairs[lv].bertdict.anchor},
  fail:{name:"LLM format failure",f:(s,lv)=>!s.repairs[lv].llm.fmt},
  bartwrong:{name:"BART: wrong anchor, capitalised word",f:(s,lv)=>!s.repairs[lv].bart.anchor&&s.repairs[lv].bart.fmt&&s.repairs[lv].bart.w.some(w=>w&&/^[A-Z]/.test(w))},
  nobody:{name:"No method restores the anchor",f:(s,lv)=>MK.every(k=>!s.repairs[lv][k].anchor)},
};
const lvForFilter=()=>state.level==="0"?"1w":state.level;
function pool(){const lv=lvForFilter();return S.map((s,i)=>i).filter(i=>FILTERS[state.filter].f(S[i],lv));}
function step(d){const p=pool();if(!p.length)return;let pos=p.indexOf(state.idx);pos=pos<0?0:(pos+d+p.length)%p.length;state.idx=p[pos];render();}
function randomPick(){const p=pool();if(p.length)state.idx=p[Math.floor(Math.random()*p.length)];render();}

// ------------------------------------------------------------------------------------------ chrome
const SCENES=[["damage","Damage"],["repair","Repairs"],["results","Results"],["trap","BERTScore vs. facts"],["lookup","Lookup"]];
function buildNav(){
  const nav=$("nav.scenes");
  SCENES.forEach(([id,name],i)=>nav.append(el("button",{role:"tab",id:"t-"+id,"aria-controls":"s-"+id,onclick:()=>{state.scene=i;render();}},
    el("span",{class:"k",text:String(i+1)}),name)));
  const meta=DATA.meta;
  $("#foot").append(`BLN600 test split, ${S.length} sentences × 5 levels. ${meta.verified?"Damaged data: frozen corrupted_v2, hash verified.":"UNVERIFIED data file: test build, not the study's data."} `+
    `Intervals, tests and SQ3 rates are read from the single executed test run (notebooks/04_evaluation.ipynb); per-sentence repairs from runs/preds/, `+
    (meta.mismatches.length?`${meta.mismatches.length} of ${meta.checked} recomputed means DIFFER from notebook 4. `:`all ${meta.checked} recomputed means match notebook 4. `),
    el("kbd",{text:"1"}),"–",el("kbd",{text:"5"})," parts, ",el("kbd",{text:"←"}),el("kbd",{text:"→"})," level, ",
    el("kbd",{text:"↑"}),el("kbd",{text:"↓"})," sentence, ",el("kbd",{text:"Space"})," play levels, ",el("kbd",{text:"R"})," random",DATA.figs&&DATA.figs.levels?[", ",el("kbd",{text:"T"})," talk mode."]:".");
}
function heading(no,text){return el("h2",{},el("span",{class:"no",text:no}),text);}
function caption(label,...kids){return el("p",{class:"cap"},el("b",{text:label+": "}),...kids);}

function levelButtons(lvls,cur,onpick){
  return el("div",{class:"seg",role:"group","aria-label":"Damage level"},...lvls.map(l=>el("button",{"aria-pressed":String(cur===l),onclick:()=>onpick(l)},
    LEVEL_COL[l]?el("span",{class:"lv",style:`background:${LEVEL_COL[l][0]}`}):null,LEVEL_NAME[l])));
}
function sentenceControls(withClean){
  const s=S[state.idx], p=pool(), pos=p.indexOf(state.idx);
  const lvls=(withClean?["0"]:[]).concat(LEVELS);
  if(!withClean&&state.level==="0"){state.level="1w";}
  const sel=el("select",{"aria-label":"Which sentences to step through",onchange:e=>{state.filter=e.target.value;const q=pool();if(q.length&&!q.includes(state.idx))state.idx=q[0];render();}},
    ...Object.entries(FILTERS).map(([k,f])=>el("option",{value:k,selected:k===state.filter},f.name)));
  return el("div",{class:"controls"},
    el("div",{class:"group"},el("label",{class:"t",text:"sentence"}),
      el("button",{class:"btn","aria-label":"Previous sentence",onclick:()=>step(-1)},"‹"),
      el("button",{class:"btn","aria-label":"Next sentence",onclick:()=>step(1)},"›"),
      el("button",{class:"btn",onclick:randomPick},"random"),sel,
      el("span",{class:"sid",text:`${s.id}, ${s.tokens.length} words, ${pos<0?"not in filter":(pos+1)+"/"+p.length}`})),
    el("div",{class:"group"},el("label",{class:"t",text:"damage"}),levelButtons(lvls,state.level,l=>{stopPlay();state.level=l;render();}),
      el("button",{class:"btn",onclick:togglePlay,"aria-label":"Play through the levels"},state.playing?"stop":"play")));
}
function togglePlay(){ if(state.playing){stopPlay();render();return;}
  const seq=(state.scene===0?["0"]:[]).concat(LEVELS); let i=Math.max(0,seq.indexOf(state.level));
  if(i===seq.length-1)i=-1;
  state.playing=setInterval(()=>{i++; if(i>=seq.length){stopPlay();render();return;} state.level=seq[i]; render();},1500);
  i++; state.level=seq[Math.min(i,seq.length-1)]; render();}
function stopPlay(){if(state.playing){clearInterval(state.playing);state.playing=null;}}

// ---------------------------------------------------------------------------------- scene 1: damage
function renderDamage(root){
  const s=S[state.idx], lv=state.level;
  root.append(heading("1","Controlled damage at five nested levels"),sentenceControls(true));
  const L=lv==="0"?null:s.levels[lv], tint=L?LEVEL_COL[lv][1]:null;
  const slots=L?Object.fromEntries(L.slots.map(([i,out,d])=>[i,{out,d}])):{};
  const facts=new Set(s.facts);
  const sent=el("p",{class:"sentence"});
  s.tokens.forEach((t,i)=>{
    const sl=slots[i];
    let cls="tok", txt=t;
    if(sl){cls+=sl.d?" drop":" dmg"; txt=sl.d?"⟨?⟩":sl.out;}
    if(facts.has(i)&&!sl)cls+=" fact";
    if(i===s.anchor)cls+=" anchor";
    sent.append(el("span",{class:cls,style:sl?`background:${tint}`:null,title:sl?`gold: ${t}`:(i===s.anchor?"anchor fact":facts.has(i)?"fact token":""),text:txt})," ");
  });
  const k=L?L.slots.length:0, nf=L?L.facts.length:0, nd=L?L.slots.filter(x=>x[2]).length:0;
  root.append(sent,
    el("div",{class:"key"},
      el("span",{},el("i",{style:`background:${tint||LEVEL_COL["25"][1]}`}),"damaged word, as every method sees it"),
      el("span",{},"⟨?⟩ dropped word (no letters left)"),
      el("span",{},el("i",{style:"outline:1.5px solid #0b0b0b;outline-offset:-2px"}),"anchor fact"),
      el("span",{},el("i",{style:"border-bottom:2px dotted #777;height:11px"}),"other fact token")),
    el("table",{class:"bt stats"},
      el("tr",{},el("th",{text:"Level"}),el("th",{class:"r",text:"Damaged words"}),el("th",{class:"r",text:"Facts in span"}),el("th",{class:"r",text:"Dropped"}),el("th",{class:"r",text:"Span CER"})),
      el("tr",{},el("td",{text:LEVEL_NAME[lv]}),el("td",{class:"r",text:`${k} of ${s.tokens.length}`}),el("td",{class:"r",text:String(nf)}),el("td",{class:"r",text:String(nd)}),el("td",{class:"r",text:L?pct(L.cer):"0%"}))),
    caption("Figure 1",`One test sentence (${s.id}); hover a damaged word for its gold form. The anchor fact is always damaged and never dropped. `+

let LEX=null;
function lev(a,b,cap){ // Levenshtein with an early exit above cap
  const n=a.length,m=b.length; if(Math.abs(n-m)>cap)return cap+1;
  let prev=new Array(m+1); for(let j=0;j<=m;j++)prev[j]=j;
  for(let i=1;i<=n;i++){const cur=[i];let best=i;for(let j=1;j<=m;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<best)best=cur[j];}
    if(best>cap)return cap+1; prev=cur;}
  return prev[m];}
function nearest(q,n=8){ const out=[]; let cap=Math.max(3,Math.ceil(q.length*0.6));
  for(const [w,c] of LEX){const d=lev(q,w,cap); if(d<=cap){out.push([w,d,c]); if(out.length>400){out.sort(byRank);out.length=n;cap=out[out.length-1][1];}}}
  out.sort(byRank); return out.slice(0,n);}
function byRank(a,b){return a[1]-b[1]||b[2]-a[2]||(a[0]<b[0]?-1:a[0]>b[0]?1:0);}
function renderLookup(root){
  root.append(heading("5","Dictionary lookup, the non-GenAI baseline"));
  if(!DATA.lexicon){root.append(el("p",{text:"The word list was not built (data/raw/BLN600 missing when the demo was built)."}));return;}
  LEX=LEX||DATA.lexicon;
  const s=S[state.idx], L=s.levels[state.level==="0"?"1w":state.level];
  const presets=[...new Set(L.slots.filter(x=>!x[2]).map(x=>x[1].replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"")).filter(Boolean))].slice(0,8);
  const input=el("input",{type:"text",value:state.lookupWord,placeholder:"type a damaged word","aria-label":"Damaged word",spellcheck:"false",autocomplete:"off"});
  const list=el("table",{class:"bt cands"});
  const run=()=>{state.lookupWord=input.value.trim();
    const res=state.lookupWord?nearest(state.lookupWord):[];
    list.replaceChildren(el("tr",{},el("th",{text:"List word"}),el("th",{class:"r",text:"Edits"}),el("th",{class:"r",text:"Count in list"})),
      ...res.map(([w,d,c])=>el("tr",{},el("td",{class:"wd",text:w}),el("td",{class:"r",text:String(d)}),el("td",{class:"r",text:c.toLocaleString("en-US")}))));};
  input.addEventListener("input",run);
  const pre=el("div",{class:"presets"},...["Hacley","Wrighb","Curbis","Jeseph"].concat(presets).map(p=>
    el("button",{class:"btn",onclick:()=>{input.value=p;run();input.focus();}},p)));
  root.append(el("div",{class:"lookup"},el("div",{},input,pre,list),
    el("div",{class:"explain"},
      el("p",{},"This is the whole method: the closest spelling (Levenshtein distance, case-sensitive) in a list of ",el("b",{text:`${LEX.length.toLocaleString("en-US")} words`}),
        " from the gold text of the 443 excerpts outside the sample; ties go to the more frequent word. No context, no model. It restores the anchor in 51% of sentences at every level, because the anchor's damage is the same at every level."),
      el("p",{},"BERT + dictionary adds the ",el("code",{text:"5"})," closest list words to BERT's own candidates and scores all of them by BERT's mean log-probability per piece plus ",el("code",{text:"λ = 64"}),
        " times letter similarity: the letters decide most slots, and BERT's context breaks near ties and fills dropped words."),
      el("p",{},"Where the list fails: it holds only 77% of the damaged fact words (dev), and a dropped word has no letters to look up."),
      el("p",{},"Presets: the first four are fixed examples. Hacley (gold Hanley) and Wrighb (gold Wright) are from the paper; Hanley is not in the list, so the lookup cannot find it. The rest are the damaged words of sentence ",el("span",{class:"sid",text:s.id})," at this level."))));
  run();
}

// ------------------------------------------------------------------------------------------ talk mode
// Five steps for the talk, one claim each, shown on the talk sentence (DATA.talk). Every number in a claim is
// read from the data, never typed in. The explorer (parts 1 to 5) stays one key away for the discussion.
const TALK_MAIN=["bertdict","llm","lookup","bart"];
// Open points for the team, drawn like LaTeX todonotes. Set REVIEW to false (or press N) once they are settled.
let REVIEW=true;
const REVIEW_NOTES={
  "1":"Wording OK? 'Anchor fact' = the one fact we track in each sentence; say this aloud.",
  "2a":"Hand-picked example, chosen because it shows the effect. Say aloud that it is one sentence; the averages follow in step 3. OK to show it?",
  "2b":"BART gets 6 of 9 words right, BERT + dict. only 3 of 9, so BART's higher BERTScore is partly deserved. Our point is only that the wrong name hardly costs anything. Agree with this framing?",
  "3":"'About half': BERT + dict. anchor 53 to 58%, Fact Recovery Rate 48 to 58%. The LLM's drop is partly format failures (scored as no repair). OK?",
  "4":"Shows BART at 25% only (BART is descriptive in the paper). Show BERT + dict. instead (rate 0.33 there)? Would need a new figure.",
  "5":"Our interpretation (paper, conclusion: 'the letters carry most of this'): the lookup alone restores 51% of anchors, BERT + dict. 53 to 58%. OK as the closing message?"};

}

      el("div",{class:"controls"},levelButtons(["0"].concat(LEVELS),lv,l=>{state.frame=talkFrames().findIndex(q=>q.step===1&&q.level===l);render();})),sent,
      el("p",{class:"sub",text:L?`${LEVEL_NAME[lv]}: ${k} of ${s.tokens.length} words damaged${nd?`, ${nd} dropped (⟨?⟩)`:""}, span CER ${pct(L.cer)}. The boxed anchor fact looks the same at every level.`
        :"A sentence from a London crime report, 1834 to 1894 (BLN600). Boxed: the anchor fact we track."}));
  } else if(fr.step===2){

    const rows=[el("tr",{class:"gold"},el("td",{class:"m"},el("span",{style:"display:inline-block;width:34px"}),"Gold"),el("td",{},spanTokens(s,tl,undefined,null,false,1)),el("td",{}),fr.bs?el("td",{}):null,fr.bs?el("td",{}):null),
      el("tr",{},el("td",{class:"m"},swatch("none"),"Damaged input"),el("td",{},spanTokens(s,tl,null,null,false,1)),el("td",{}),fr.bs?el("td",{}):null,fr.bs?el("td",{class:"r",text:fmt(L.bs_none)}):null)];
    TALK_MAIN.forEach((k,n)=>{const r=R[k];rows.push(el("tr",{class:n===0?"mid":""},el("td",{class:"m"},swatch(k),MNAME[k]),
      el("td",{},r.fmt?null:el("span",{class:"fail",text:"format failure:"}),spanTokens(s,tl,r.fmt?r.w:null,r.ok,false,1)),
      el("td",{class:"r"},el("span",{class:r.anchor?"yes":"nope",text:r.anchor?"right":"wrong"})),
      fr.bs?el("td",{class:"r",text:`${r.ok.filter(Boolean).length} of ${r.ok.length}`}):null,
      fr.bs?el("td",{class:"r"+(k==="bart"||k==="bertdict"?" hi":""),text:fmt(r.bs)}):null));});
    box.append(kick(2),el("h2",{class:"claim",text:claim}),el("table",{class:"bt race"},head,...rows),
      el("p",{class:"sub",text:fr.bs?`BART restores ${R.bart.ok.filter(Boolean).length} of ${R.bart.ok.length} words but not the name; BERT + dict. ${R.bertdict.ok.filter(Boolean).length} of ${R.bertdict.ok.length}, including the name. A span-level similarity counts the fact as one word among many.`
        :"Every method sees the intact context and the damaged words, never the gold words. Green: restored exactly; red: wrong; box: the anchor."}));
  } else if(fr.step===3){
    const a=k=>LEVELS.map(l=>DATA.ci.anchor[k][l][0]);
    const t=DATA.tests.filter(q=>q.pair[0]==="bertdict"&&q.pair[1]==="llm"&&q.mcnemar_holm<0.05).map(q=>LEVEL_NAME[q.level]);
    box.append(kick(3),el("h2",{class:"claim",text:"Even the best method restores only about half of the facts, at every damage level"}),
      el("div",{class:"fig"}),
      el("p",{class:"sub",text:`Repair does not suddenly collapse at any level. Anchor restored, 1 word to 75%: BERT + dict. ${pct(a("bertdict")[0])} to ${pct(a("bertdict")[4])}, lookup ${range(a("lookup").map(v=>v*100))}%, `+
        `LLM ${pct(a("llm")[0])} to ${pct(a("llm")[4])}, significantly below BERT + dict. at ${t.join(" and ")}. The LLM's drop goes with format failures: `+

function renderTalk(root){const f=talkFrames();state.frame=Math.max(0,Math.min(f.length-1,state.frame));talkFrame(root,f[state.frame],f.length,state.frame);}

// ----------------------------------------------------------------------------------------- render
const RENDER=[renderDamage,renderRepair,renderResults,renderTrap,renderLookup];
let lastScene=null;
function render(){
  const where=state.mode==="talk"?"talk":state.scene;
  if(where!==lastScene){window.scrollTo(0,0);lastScene=where;}
  document.body.classList.toggle("talking",state.mode==="talk");
  const talk=$("#s-talk"); talk.replaceChildren();
  if(state.mode==="talk"){document.querySelectorAll("section.scene").forEach(sec=>{sec.classList.remove("active");sec.replaceChildren();});renderTalk(talk);return;}
  document.querySelectorAll("nav.scenes button").forEach((b,i)=>b.setAttribute("aria-selected",String(i===state.scene)));
  document.querySelectorAll("section.scene").forEach((sec,i)=>{sec.classList.toggle("active",i===state.scene);if(i!==state.scene)sec.replaceChildren();});
  const root=document.querySelectorAll("section.scene")[state.scene]; root.replaceChildren(); RENDER[state.scene](root);
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")){if(e.key==="Escape")e.target.blur();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key.toLowerCase()==="t"&&DATA.figs&&DATA.figs.levels){state.mode=state.mode==="talk"?"explore":"talk";stopPlay();render();e.preventDefault();return;}
  if(state.mode==="talk"){ // arrows, space and a presenter's clicker (PageDown / PageUp)
    if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(e.key)){state.frame++;render();e.preventDefault();}
    else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)){state.frame--;render();e.preventDefault();}
    else if(e.key==="Home"){state.frame=0;render();e.preventDefault();}
    else if(e.key.toLowerCase()==="n"){REVIEW=!REVIEW;render();e.preventDefault();}
    else if(/^[1-5]$/.test(e.key)){state.mode="explore";state.scene=+e.key-1;render();e.preventDefault();}
    return;}
  if(/^[1-5]$/.test(e.key)){e.preventDefault();state.scene=+e.key-1;render();}
  else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const seq=(state.scene===0?["0"]:[]).concat(LEVELS);let i=seq.indexOf(state.level);
    i=Math.max(0,Math.min(seq.length-1,i+(e.key==="ArrowRight"?1:-1)));stopPlay();state.level=seq[i];render();e.preventDefault();}
  else if(e.key==="ArrowDown"){step(1);e.preventDefault();} else if(e.key==="ArrowUp"){step(-1);e.preventDefault();}
  else if(e.key===" "&&state.scene<2){togglePlay();e.preventDefault();}
  else if(e.key.toLowerCase()==="r"&&state.scene<2)randomPick();
});
