# Fine-tuning facebook/bart-base to repair damaged sentences (notebook 2c, scripts/train_bart.py).
# The settings follow configs/bert_ft.yaml wherever the two models allow it, so the two fine-tunings differ
# only where they must. The seed is read from configs/config.yaml (one seed).
version: v1
model_name: facebook/bart-base
pool: data/processed/bert_train_pool.jsonl
pool_sha256: runs/bert_train_pool.sha256        # checked before training
train:
  learning_rate: 5.0e-5
  batch_size: 16
  max_epochs: 10                                # cap; early stopping decides
  patience: 2                                   # stop after 2 epochs without a lower validation loss
  warmup_frac_of_epoch: 0.10                    # then linear decay to 0 over max_epochs
  weight_decay: 0.01
  grad_clip: 1.0
  max_length: 320                               # assert, never truncate (longest example: 251 input, 211 output tokens)
  bf16_on_gpu: true                             # bfloat16 autocast on a GPU that supports it
  eval_batch_size: 64
  log_every: 100                                # train loss rows in the log, in steps
smoke:
  steps: 30
  n_train_examples: 64                          # 4 fixed batches, repeated: the loss must go down
  n_val_examples: 64
  eval_batch_size: 16                           # small: the smoke run also runs on an 8 GB laptop
