# Fine-tuning bert-base-cased as a masked language model on the training pool (notebook 2, Part B).
# The seed is not repeated here: scripts/train_bert.py reads it from configs/config.yaml (one seed).
version: v1
model_name: bert-base-cased
pool: data/processed/bert_train_pool.jsonl
pool_sha256: runs/bert_train_pool.sha256        # checked before training
train:
  learning_rate: 5.0e-5
  batch_size: 16
  max_epochs: 10                                # cap; early stopping decides
  patience: 2                                   # stop after 2 epochs without a lower validation loss
  warmup_frac_of_epoch: 0.10                    # about 180 steps, then linear decay over max_epochs
  weight_decay: 0.01
  grad_clip: 1.0
  max_length: 192                               # assert, never truncate
  fp16_on_gpu: true                             # mixed precision on the GPU only
  eval_batch_size: 64
  log_every: 100                                # train loss rows in the log, in steps
smoke:
  steps: 30
  n_train_examples: 64                          # 4 fixed batches, repeated: the loss must go down
  n_val_examples: 256
